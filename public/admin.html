<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Admin · Radio Araucana</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#0e1a12;--surface:#13231a;--card:#19301f;--border:rgba(255,255,255,.08);
    --bone:#f1f5f1;--bone-dim:rgba(241,245,241,.55);--muted:rgba(241,245,241,.3);
    --green:#52b870;--green-dark:#29623a;--green-bright:#7dbb5e;
    --red:#cc0000;--gold:#d4a017;
    --f-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --radius:8px;
  }
  body{background:var(--ink);color:var(--bone);font-family:var(--f-sans);font-size:14px;line-height:1.5;min-height:100vh}
  input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
  a{color:var(--green-bright)}

  /* ─── PASSWORD OVERLAY ─── */
  #pwOverlay{position:fixed;inset:0;background:var(--ink);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px}
  .pw-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 32px;width:100%;max-width:380px;text-align:center}
  .pw-logo{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--green-bright);font-family:var(--f-mono);margin-bottom:20px}
  .pw-title{font-size:22px;font-weight:600;margin-bottom:6px}
  .pw-sub{font-size:13px;color:var(--bone-dim);margin-bottom:24px}
  .pw-input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:11px 14px;outline:none;margin-bottom:12px;transition:border-color .15s}
  .pw-input:focus{border-color:var(--green)}
  .pw-input::placeholder{color:var(--muted)}
  .pw-btn{width:100%;padding:12px;background:var(--green-dark);border:none;border-radius:8px;color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:background .15s}
  .pw-btn:hover{background:var(--green)}
  .pw-error{color:#f87171;font-size:12px;margin-top:10px;min-height:18px}

  /* ─── MAIN LAYOUT ─── */
  #adminPanel{display:none;flex-direction:column;min-height:100vh}
  #adminPanel.visible{display:flex}

  .adm-header{position:sticky;top:0;z-index:100;background:rgba(14,26,18,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;flex-shrink:0;gap:12px}
  .adm-brand{display:flex;align-items:center;gap:10px;min-width:0}
  .adm-brand-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
  .adm-brand-text{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adm-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .adm-status{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .adm-status.ok{color:var(--green)}
  .adm-status.err{color:#f87171}
  .btn{padding:8px 18px;background:var(--green-dark);border:none;border-radius:7px;color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:background .15s, opacity .15s}
  .btn:hover{background:var(--green)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--bone-dim)}
  .btn-ghost:hover{background:rgba(255,255,255,.04);color:var(--bone)}
  .btn-danger{background:#7f1d1d}
  .btn-danger:hover{background:#991b1b}

  /* ─── TABS ─── */
  .adm-tabs{display:flex;gap:2px;padding:14px 24px 0;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
  .adm-tab{padding:9px 16px;border:none;background:transparent;color:var(--bone-dim);font-size:13px;cursor:pointer;border-radius:7px 7px 0 0;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-weight:500}
  .adm-tab:hover{color:var(--bone)}
  .adm-tab.active{color:var(--bone);background:rgba(125,187,94,.08);border-bottom-color:var(--green-bright)}

  /* ─── CONTENT ─── */
  .adm-body{padding:28px 24px 60px;max-width:1100px;width:100%;margin:0 auto;flex:1}
  .adm-body.wide{max-width:1400px}
  .panel{display:none}
  .panel.active{display:block}
  .panel-title{font-size:18px;font-weight:600;margin-bottom:6px}
  .panel-sub{font-size:13px;color:var(--bone-dim);margin-bottom:20px}

  .field{margin-bottom:14px}
  .field-label{display:block;font-size:12px;font-weight:600;color:var(--bone-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
  .field-hint{font-size:11px;color:var(--muted);margin-top:4px}
  input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:7px;padding:10px 12px;outline:none;transition:border-color .15s}
  input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus,input[type=url]:focus,select:focus,textarea:focus{border-color:var(--green)}
  textarea{resize:vertical;min-height:80px;font-family:inherit}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.field-row{grid-template-columns:1fr}}

  /* ─── ITEM CARDS (lists) ─── */
  .item-list{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .item-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
  .item-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .item-card-title{font-size:13px;font-weight:600;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.06em}
  .item-card-actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{width:30px;height:30px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--bone-dim);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;padding:0}
  .icon-btn:hover{background:rgba(255,255,255,.04);color:var(--bone)}
  .icon-btn.danger:hover{background:#7f1d1d;border-color:#7f1d1d;color:#fff}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed}
  .add-btn{padding:10px 16px;background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--bone-dim);width:100%;cursor:pointer;font-size:13px;transition:all .15s}
  .add-btn:hover{border-color:var(--green);color:var(--green-bright);background:rgba(125,187,94,.04)}

  /* ─── IMAGE FIELD ─── */
  .img-field{display:flex;gap:12px;align-items:flex-start}
  .img-thumb{width:100px;height:70px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
  .img-actions{display:flex;flex-direction:column;gap:6px;flex:1}
  .img-actions input{font-size:12px}

  /* ─── BODY (paragraphs) ─── */
  .body-list{display:flex;flex-direction:column;gap:8px}
  .body-row{display:flex;gap:8px;align-items:flex-start}
  .body-row textarea{flex:1}
  .body-row .icon-btn{flex-shrink:0}

  /* ─── PODCAST Y REELS ─── */
  .yt-cols{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start}
  @media (max-width:900px){.yt-cols{grid-template-columns:1fr}}
  .yt-col-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .yt-col-title{font-size:13px;font-weight:600;color:var(--green-bright);text-transform:uppercase;letter-spacing:.08em}
  .yt-list{display:flex;flex-direction:column;gap:6px}
  .yt-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .yt-row.dragging{opacity:.35}
  .yt-row.drop-before{box-shadow:inset 0 2px 0 0 var(--green-bright)}
  .yt-row.drop-after{box-shadow:inset 0 -2px 0 0 var(--green-bright)}
  .yt-grip{flex-shrink:0;color:var(--muted);font-size:15px;line-height:1;cursor:grab;user-select:none}
  .yt-row.dragging .yt-grip{cursor:grabbing}
  .yt-pos{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:20px;text-align:right;flex-shrink:0}
  .yt-thumb{width:60px;height:34px;border-radius:4px;object-fit:cover;background:rgba(255,255,255,.04);flex-shrink:0}
  .yt-thumb.vertical{width:26px;height:46px}
  .yt-info{flex:1;min-width:0}
  .yt-title-input{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--bone);font-size:13px;padding:3px 5px;font-family:inherit}
  .yt-title-input:hover{border-color:var(--border)}
  .yt-title-input:focus{border-color:var(--green);background:rgba(0,0,0,.25);outline:none}
  .yt-add{display:flex;gap:6px;margin-bottom:16px}
  .yt-add input{flex:1;min-width:0}
  .yt-add .btn{flex-shrink:0}
  .yt-actions{display:flex;gap:3px;flex-shrink:0}
  .yt-actions .icon-btn{width:26px;height:26px;font-size:13px}
  .yt-actions .icon-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(212,160,23,.1)}
  .yt-picked{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .yt-picked-title{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .yt-empty{font-size:13px;color:var(--muted);border:1px dashed var(--border);border-radius:8px;padding:16px;text-align:center}
  .yt-extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .yt-extra input,.yt-extra select{font-size:12px;padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.2);border:1px solid var(--border);color:var(--bone);font-family:inherit}
  /* width:auto anula el width:100% general de inputs y selects: con él, el
     select se comía la fila y el campo de serie quedaba en cero. */
  .yt-extra input{flex:1 1 140px;width:auto;min-width:140px}
  .yt-extra select{flex:0 0 auto;width:auto}
  .yt-peso{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .yt-extra .yt-peso input{flex:none;width:14px;height:14px;min-width:0;padding:0;margin:0;accent-color:var(--gold)}
  .yt-peso:has(input:checked){color:var(--gold)}
  .yt-ficha{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-left:8px;border-left:2px solid rgba(212,160,23,.5)}
  .yt-ficha input{flex:1 1 150px;width:auto;min-width:120px;font-size:12px;padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.2);border:1px solid var(--border);color:var(--bone);font-family:inherit}
  .yt-ficha input:first-child{flex-basis:100%}
  .yt-destacado{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px}
  .yt-destacado-head{flex-basis:100%;display:flex;gap:8px;align-items:center;font-size:13px}
  .yt-destacado-star{color:var(--gold)}
  .yt-destacado-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:220px}
  .yt-destacado-field input{font-size:13px}
  .yt-destacado-field input[type=date]{width:auto;max-width:220px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--bone);color-scheme:dark}
  .yt-hint{font-size:11px;color:var(--muted)}
  .yt-hint-alerta{color:var(--gold)}
  .yt-destacado-trio{flex-basis:100%;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
  .yt-desde-titulo{font-size:12px;padding:8px 12px;margin-bottom:18px}
  .yt-note{font-size:12px;color:var(--muted);margin:0 0 16px}
  /* En el teléfono los 6 botones no dejan ancho para el título: la fila se
     parte y el título baja a su propia línea. */
  @media (max-width:640px){
    .yt-row{flex-wrap:wrap;row-gap:6px}
    .yt-info{order:10;flex-basis:100%}
  }

  /* ─── EN CUADRITOS ─── */
  .cq-nuevo{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
  .cq-sub{font-size:13px;font-weight:600;color:var(--green-bright);text-transform:uppercase;letter-spacing:.08em;margin:0}
  .cq-zona{border:1.5px dashed var(--border);border-radius:10px;padding:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;transition:border-color .15s,background .15s}
  .cq-zona.sobre{border-color:var(--green-bright);background:rgba(125,187,94,.06)}
  .cq-zona p{margin:0;font-size:13px;color:var(--bone-dim)}
  .cq-file{display:none}
  .cq-archivos{flex-basis:100%;font-size:12px;color:var(--muted)}
  .cq-campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
  .cq-campo{display:flex;flex-direction:column;min-width:0}
  .cq-campo.cq-ancho{grid-column:1/-1}
  .cq-acciones{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .cq-progreso{font-size:13px;color:var(--green-bright);margin:0}
  .cq-fila{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px}
  .cq-thumb{width:64px;height:80px;border-radius:5px;object-fit:cover;background:rgba(255,255,255,.04);flex-shrink:0}
  .cq-datos{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .cq-datos input,.cq-datos textarea{font-size:13px;padding:6px 8px}
  .cq-datos textarea{min-height:52px}
  @media (max-width:760px){.cq-campos{grid-template-columns:minmax(0,1fr)}.cq-fila{flex-wrap:wrap}.cq-datos{flex-basis:calc(100% - 76px)}}

  /* ─── TOAST ─── */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;transition:transform .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #toast.visible{transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:var(--green);color:var(--green-bright)}
  #toast.err{border-color:#7f1d1d;color:#f87171}
</style>
</head>
<body>

<!-- ─── Password Overlay ─── -->
<div id="pwOverlay">
  <div class="pw-box">
    <p class="pw-logo">Radio Araucana</p>
    <h1 class="pw-title">Panel de Edición</h1>
    <p class="pw-sub">Ingresá la clave para continuar</p>
    <input id="pwInput" type="password" class="pw-input" placeholder="Contraseña" autocomplete="current-password" />
    <button id="pwBtn" class="pw-btn">Entrar</button>
    <p id="pwError" class="pw-error"></p>
  </div>
</div>

<!-- ─── Main Panel ─── -->
<div id="adminPanel">
  <header class="adm-header">
    <div class="adm-brand">
      <div class="adm-brand-dot"></div>
      <div class="adm-brand-text">Radio Araucana · Edición</div>
    </div>
    <div class="adm-actions">
      <span id="status" class="adm-status">Cargando…</span>
      <button id="saveBtn" class="btn" disabled>Guardar cambios</button>
      <button id="logoutBtn" class="btn btn-ghost">Salir</button>
    </div>
  </header>

  <nav class="adm-tabs" id="tabs"></nav>
  <main class="adm-body" id="body"></main>
</div>

<div id="toast"></div>

<script type="module">
  /* ───────── State ───────── */
  const PW_KEY = "radio-araucana.admin.pw";
  let pw = sessionStorage.getItem(PW_KEY) || "";
  let content = null;
  let dirty = false;

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, props, ...children) => {
    const e = document.createElement(tag);
    if (props && typeof props === "object") {
      for (const [k, v] of Object.entries(props)) {
        if (k === "class") e.className = v;
        else if (k === "html") e.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v !== undefined && v !== null) e.setAttribute(k, v);
      }
    }
    for (const c of children.flat()) {
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  };
  const toast = (msg, kind = "ok") => {
    const t = $("#toast");
    t.textContent = msg;
    t.className = kind;
    requestAnimationFrame(() => t.classList.add("visible"));
    setTimeout(() => t.classList.remove("visible"), 2400);
  };
  const markDirty = () => {
    dirty = true;
    $("#saveBtn").disabled = false;
    $("#status").textContent = "Cambios sin guardar";
    $("#status").className = "adm-status";
  };

  /* ───────── Auth + Load ───────── */
  async function tryLogin(password) {
    // We probe the save endpoint with an empty body. A correct password
    // returns 400 (invalid body), wrong password returns 401.
    const res = await fetch("/api/admin/save", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${password}` },
      body: JSON.stringify({}),
    });
    return res.status !== 401;
  }

  async function loadContent() {
    const res = await fetch("/api/content", { cache: "no-store" });
    if (!res.ok) throw new Error("Failed to load content");
    return res.json();
  }

  async function saveContent() {
    if (!pw || !content) return;
    $("#saveBtn").disabled = true;
    $("#status").textContent = "Guardando…";
    $("#status").className = "adm-status";
    try {
      const res = await fetch("/api/admin/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pw}` },
        body: JSON.stringify(content),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      dirty = false;
      // En `vite dev` el guardado es un stub: no se toca el blob de producción.
      $("#status").textContent = data.dev ? "Dev: no guardado" : "Guardado ✓";
      $("#status").className = "adm-status ok";
      toast(data.dev ? "Modo dev: los cambios NO se guardaron" : "Guardado correctamente", "ok");
    } catch (err) {
      $("#status").textContent = "Error";
      $("#status").className = "adm-status err";
      $("#saveBtn").disabled = false;
      toast(`Error al guardar: ${err.message}`, "err");
    }
  }

  async function uploadImage(file) {
    if (!file) throw new Error("Sin archivo");
    if (file.size > 5 * 1024 * 1024) throw new Error("Imagen demasiado grande (máx 5MB)");
    const url = `/api/admin/upload?filename=${encodeURIComponent(file.name)}`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": file.type || "application/octet-stream",
        Authorization: `Bearer ${pw}`,
      },
      body: file,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data.url;
  }

  /* ───────── Tabs ───────── */
  const TABS = [
    { id: "settings", label: "Configuración",  render: renderSettings },
    { id: "news",     label: "Noticias",       render: () => renderList("news", newsCard, renderNewsToggle()) },
    { id: "programs", label: "Programación",   render: () => renderList("programs", programCard) },
    { id: "regions",  label: "Destinos",       render: () => renderList("regions", regionCard) },
    { id: "podcast",  label: "Podcast y reels", render: renderPodcast, wide: true },
    { id: "cuadritos", label: "La Región al Día",  render: renderCuadritos, wide: true },
    { id: "whatsappOptions", label: "WhatsApp", render: renderWhatsApp },
  ];
  let currentTab = "settings";

  function renderTabs() {
    const tabsEl = $("#tabs");
    tabsEl.innerHTML = "";
    TABS.forEach((t) => {
      const b = el("button", {
        class: "adm-tab" + (t.id === currentTab ? " active" : ""),
        onClick: () => { currentTab = t.id; renderTabs(); renderBody(); },
      }, t.label);
      tabsEl.appendChild(b);
    });
  }

  function renderBody() {
    const tab = TABS.find((t) => t.id === currentTab);
    const body = $("#body");
    body.className = "adm-body" + (tab.wide ? " wide" : "");
    body.innerHTML = "";
    body.appendChild(tab.render());
  }

  /* ───────── Settings panel ───────── */
  function settingField(key, label, type = "text", hint = "") {
    const input = el("input", {
      type,
      value: content.settings[key] ?? "",
      oninput: (e) => { content.settings[key] = e.target.value; markDirty(); },
    });
    return el("div", { class: "field" },
      el("label", { class: "field-label" }, label),
      input,
      hint ? el("p", { class: "field-hint" }, hint) : null,
    );
  }

  // Bloque "Streaming en vivo (video)": toggle En vivo + tipo HLS/iframe.
  function renderLiveVideo() {
    const lv = content.settings.liveVideo
      || (content.settings.liveVideo = { enabled: false, type: "hls", hlsUrl: "", iframeCode: "" });

      : textField("URL del stream HLS (.m3u8)", lv.hlsUrl,

    return el("div", null, toggle, typeField, sourceField);
  }

  // "Video destacado cuando no hay vivo": se elige con ▶ en la pestaña
  // «Podcast y reels» (settings.offlineVideo guarda su URL). Acá sólo se

          onClick: () => { content.settings.offlineVideo = ""; markDirty(); renderBody(); } }, "×") : null,
      ),
      el("p", { class: "field-hint" },
        "Se muestra en el reproductor de la portada cuando el toggle \"En vivo ahora\" está apagado. Al encender el vivo, la señal reemplaza el video automáticamente. Se fija con el botón ▶ en la pestaña «Podcast y reels»; si no fijas ninguno, sale solo el capítulo más nuevo."),
    );

  function renderSettings() {

  /* ───────── List renderer ───────── */
  function renderList(key, cardFn, extra = null) {
    const items = content[key] || [];
    const list = el("div", { class: "item-list" });
    items.forEach((item, i) => list.appendChild(cardFn(item, i, items)));
    const addBtn = el("button", { class: "add-btn", onClick: () => {
      content[key] = [...(content[key] || []), cardFn.empty()];
      markDirty();
      renderBody();
    } }, "+ Agregar");

    return el("div", { class: "panel active" },
      el("h2", { class: "panel-title" }, panelTitleFor(key)),
      el("p", { class: "panel-sub" }, panelSubFor(key)),
      extra,
      list,
      addBtn,
    );
  }

  // Interruptor "Mostrar noticias en la portada" (settings.newsEnabled).
  // Apagado por defecto: mientras no exista un proceso que las actualice a
  // diario, la sección "Lo Más Reciente" y sus links del menú/footer se
  // ocultan para que la portada no se vea desactualizada. Las noticias
  // cargadas se conservan y reaparecen al encenderlo.
  function renderNewsToggle() {
    const on = content.settings.newsEnabled === true;
    const checkbox = el("input", { type: "checkbox",
      oninput: (e) => { content.settings.newsEnabled = e.target.checked; markDirty(); renderBody(); } });
    if (on) checkbox.setAttribute("checked", "");
    return el("div", { class: "field", style: "margin-bottom:18px;padding:14px 16px;border:1px solid var(--border);border-radius:6px" },
      el("label", { class: "field-label" }, "Mostrar noticias en la portada"),
      el("label", { style: "display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--bone)" },
        checkbox,
        el("span", null, on
          ? "Encendido — la sección «Lo Más Reciente» se muestra en la portada"
          : "Apagado — la sección y el link «Noticias» del menú están ocultos"),
      ),
      el("p", { class: "field-hint" },
        "Enciéndelo solo cuando exista un proceso que actualice las noticias todos los días. Las noticias de abajo se guardan igual aunque esté apagado."),
    );
  }

  /* ───────── Podcast y reels (content.videos) ───────── */
  // content.videos es la lista completa y ordenada a mano que muestra la
  // portada: [{ youtube, title, kind, serie?, tema?, added? }], donde kind
  // "short" es un reel vertical y cualquier otro valor (o ninguno) es un
  // capítulo. El orden del array es el orden de la portada. `serie` agrupa
  // capítulos, `tema` se muestra bajo el título y `added` es el día en que se
  // pegó el link (AAAA-MM-DD, hora de Chile).
  //
  // Antes la portada leía el canal por /api/youtube (los feeds Atom de YouTube)
  // y esta pestaña sólo guardaba un orden encima, en settings.youtubeOrder.
  // YouTube dio de baja esos feeds en septiembre de 2026 —devuelven 404 para
  // cualquier canal—, así que la lista pasó a ser manual. migrateVideos()
  // rearma content.videos desde los datos viejos la primera vez que se abre.

  function ytIdFromUrl(url) {
    const m = String(url || "").trim().match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function ytUrl(id, short) {
    return short ? `https://www.youtube.com/shorts/${id}` : `https://youtu.be/${id}`;
  }

  // Temas que la portada muestra bajo el título de cada capítulo.
  const TEMAS = ["Política", "Deporte", "Salud", "Cultura", "Negocios", "Sociedad"];

  // Hoy en Chile como AAAA-MM-DD: la fecha en que se agrega un video (para el
  // «Estreno de hoy» del header) y la que se compara con «Destacar hasta».
  const hoyChile = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Santiago" });
  // AAAA-MM-DD de dentro de `n` días (hora de Chile). Al mediodía UTC para que
  // ningún cambio de horario mueva el día.
  const enDias = (n) => {
    const d = new Date(`${hoyChile()}T12:00:00Z`);
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  // Cuánto dura la «Entrevista de la semana» desde que se marca el ★.
  const DIAS_SEMANA = 7;

  // Frase, invitado y cargo desde el título, para la «Entrevista de la semana».
  // Entiende los formatos que se usan en el canal:
  //   «"Frase": Nombre, cargo | Araucana Digital»
  //   «Frase: Nombre, cargo»          «Frase | Nombre, cargo»
  //   «Nombre, cargo: "Frase"»        (la cita entre comillas va después)
  // Un título sin dos puntos ni barra no se adivina: vuelve todo vacío y se
  // completa a mano. Lo que devuelve es una sugerencia; en el recuadro del ★
  // se puede corregir.
  function desdeTitulo(title) {
    const t = String(title || "")
      .replace(/\s*\|\s*Araucana Digital\s*$/i, "")
      .replace(/^Araucana Digital entrevista al?\s+/i, "")
      .replace(/\s*#\S+/g, "")
      .trim();
    const ABRE = "\"“«", CIERRA = "\"”»";
    const sinComillas = (s) => {
      const x = s.trim();
      return ABRE.includes(x[0]) && CIERRA.includes(x[x.length - 1]) ? x.slice(1, -1).trim() : x;
    };
    const entreComillas = (s) => { const x = s.trim(); return x.length > 2 && ABRE.includes(x[0]) && CIERRA.includes(x[x.length - 1]); };
    // «Diputado Cristian Neira», «kinesiólogo Rodrigo Sandoval»: el cargo va
    // delante y el nombre son las dos últimas palabras con mayúscula.
    const CARGO_DELANTE = /^(diputad[oa]|senador[a]?|alcalde(sa)?|seremi|concejal[a]?|gobernador[a]?|delegad[oa]|ministr[oa]|director[a]?|president[ea])$/i;
    const cargoDelante = (x) => {
      const w = x.split(/\s+/);
      if (w.length < 3 || !(CARGO_DELANTE.test(w[0]) || /^[a-záéíóúñü]/.test(w[0]))) return null;
      const nombre = w.slice(-2);
      if (!nombre.every((p) => /^[A-ZÁÉÍÓÚÑÜ]/.test(p))) return null;
      const cargo = w.slice(0, -2).join(" ");
      return { invitado: nombre.join(" "), cargo: cargo[0].toUpperCase() + cargo.slice(1) };
    };
    const persona = (s) => {
      const x = s.trim();
      const i = x.indexOf(",");
      if (i > 0) return { invitado: x.slice(0, i).trim(), cargo: x.slice(i + 1).trim() };
      return cargoDelante(x) || { invitado: x, cargo: "" };
    };
    const vacio = { frase: "", invitado: "", cargo: "" };
    if (!t) return vacio;

    // Una cita al principio puede traer sus propios dos puntos o comas: se
    // busca primero dónde cierra.
    if (ABRE.includes(t[0])) {
      const fin = [...t].findIndex((c, i) => i > 0 && CIERRA.includes(c));
      const resto = fin > 0 ? t.slice(fin + 1).trim() : "";
      if (resto.startsWith(":") || resto.startsWith("|")) {
        return { frase: t.slice(1, fin).trim(), ...persona(resto.slice(1)) };
      }
    }
    const barra = t.indexOf(" | ");
    if (barra > 0) return { frase: sinComillas(t.slice(0, barra)), ...persona(t.slice(barra + 3)) };
    // Un nombre propio: de dos a cuatro palabras, todas con mayúscula
    // («Felipe Reynero», «Dra. Lidise Hernández»).
    const esNombre = (s) => {
      const w = s.trim().split(/\s+/);
      return w.length >= 2 && w.length <= 4 && w.every((p) => /^\(?[A-ZÁÉÍÓÚÑÜ]/.test(p));
    };
    const dos = t.search(/:\s/);
    if (dos > 0) {
      const antes = t.slice(0, dos), despues = t.slice(dos + 1).trim();
      if (entreComillas(despues)) return { frase: sinComillas(despues), ...persona(antes) };
      // Títulos antiguos, «Nombre: de qué se habló»: no hay cita que poner
      // en grande, sólo el invitado.
      if (esNombre(persona(antes).invitado) && /^[a-záéíóúñü¿¡]/.test(despues)) return { frase: "", ...persona(antes) };
      // «diputado de La Araucanía José Montalva: galgos, reformas…»: lo de
      // antes parte con minúscula, así que es la persona y no una frase.
      if (/^[a-záéíóúñü]/.test(antes)) return { frase: "", ...persona(antes) };
      return { frase: sinComillas(antes), ...persona(despues) };
    }
    return vacio;
  }

  // Llena frase, invitado y cargo desde el título si los tres están vacíos.
  // Devuelve true si cambió algo.
  function fichaDesdeTitulo(v) {
    if (v.frase || v.invitado || v.cargo) return false;
    let cambio = false;
    for (const [k, val] of Object.entries(desdeTitulo(v.title))) if (val) { v[k] = val; cambio = true; }
    return cambio;
  }

  // Al abrir el panel: completa la ficha de las destacadas y del ★ que no la
  // tengan. Devuelve cuántas completó.
  function completarFichas() {
    const starId = ytIdFromUrl(content.settings?.featuredEpisode);
    let n = 0;
    for (const v of ytList("episode")) {
      const esStar = starId && ytIdFromUrl(v.youtube) === starId && !(v.serie || "").trim();
      if ((v.peso || esStar) && fichaDesdeTitulo(v)) n++;
    }
    return n;
  }

  // Serie del capítulo que apunta una URL (la del ★), o "" si no tiene.
  function serieDe(url) {
    const id = ytIdFromUrl(url);
    const v = id ? (content.videos || []).find((x) => ytIdFromUrl(x.youtube) === id) : null;
    return (v?.serie || "").trim();
  }

  // Migración de un solo uso: mezcla la lista vieja de la pestaña «Videos» con
  // settings.youtubeOrder (que era donde vivían el orden de los capítulos y los
  // reels). Corre en memoria al abrir la pestaña; se persiste con el Guardar
  // siguiente. Devuelve true sólo la primera vez.
  function migrateVideos() {
    const order = content.settings?.youtubeOrder;
    if (!order || typeof order !== "object") return false;

    const legacy = Array.isArray(content.videos) ? content.videos : [];
    const legacyTitle = new Map();
    legacy.forEach((v) => {
      const id = ytIdFromUrl(v.youtube);
      if (id && !legacyTitle.has(id)) legacyTitle.set(id, v.title || "");
    });

    const hidden = new Set(Array.isArray(order.hidden) ? order.hidden : []);
    const seen = new Set();
    const take = (saved, kind) => (Array.isArray(saved) ? saved : []).reduce((out, s) => {
      if (!s?.id || seen.has(s.id) || hidden.has(s.id)) return out;
      seen.add(s.id);
      out.push({ youtube: ytUrl(s.id, kind === "short"), title: s.title || legacyTitle.get(s.id) || "", kind });
      return out;
    }, []);

    const episodes = take(order.episodes, "episode");
    const reels = take(order.shorts, "short");
    // Los capítulos que sólo estaban en la pestaña «Videos» (más antiguos que
    // la ventana del feed) van al final, en el orden en que estaban ahí.
    legacy.forEach((v) => {
      const id = ytIdFromUrl(v.youtube);
      if (!id || seen.has(id) || hidden.has(id)) return;
      seen.add(id);
      episodes.push({ youtube: ytUrl(id, false), title: v.title || "", kind: "episode" });
    });

    content.videos = [...episodes, ...reels];
    delete content.settings.youtubeOrder;
    return true;
  }

  const ytList = (kind) => (content.videos || []).filter((v) => (kind === "short" ? v.kind === "short" : v.kind !== "short"));

  // Reescribe content.videos dejando el otro grupo intacto. El array queda
  // normalizado como [capítulos…, reels…]; la portada filtra por kind, así que
  // lo único que importa es el orden dentro de cada grupo.
  function ytSetList(kind, list) {
    const other = ytList(kind === "short" ? "episode" : "short");
    content.videos = kind === "short" ? [...other, ...list] : [...list, ...other];
    markDirty();
    renderBody();
  }

  // Un solo campo para las dos columnas: el oEmbed público de YouTube (sin
  // clave) entrega el tamaño real cuando se le pasa la URL /shorts/, así que un
  // alto mayor que el ancho identifica al reel y el video cae solo en su
  // columna, siempre arriba de todo.
  function ytAddBox() {
    const input = el("input", { id: "ytAddInput", type: "url", placeholder: "Pega el link de YouTube de un capítulo o un reel" });
    const btn = el("button", { class: "btn btn-ghost" }, "Agregar");

    const add = async () => {
      const id = ytIdFromUrl(input.value);
      if (!id) { toast("No reconozco ese link de YouTube", "err"); return; }
      if ((content.videos || []).some((v) => ytIdFromUrl(v.youtube) === id)) { toast("Ese video ya está en la lista", "err"); return; }
      btn.disabled = true;
      btn.textContent = "Buscando…";
      try {
        const r = await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(`https://www.youtube.com/shorts/${id}`)}`);
        if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "el video es privado o no permite insertarse" : "no existe o no está disponible");
        const info = await r.json();
        const short = Number(info.height) > Number(info.width);
        const kind = short ? "short" : "episode";
        ytSetList(kind, [{ youtube: ytUrl(id, short), title: info.title || "", kind, added: hoyChile() }, ...ytList(kind)]);
        toast(short ? "Reel agregado arriba de todo" : "Capítulo agregado arriba de todo", "ok");
        $("#ytAddInput")?.focus();
      } catch (err) {
        toast(`No se pudo agregar: ${err.message}`, "err");
        btn.disabled = false;
        btn.textContent = "Agregar";
      }
    };

    btn.addEventListener("click", add);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
    return el("div", { class: "yt-add" }, input, btn);
  }

  function ytColumn(kind, label) {
    const short = kind === "short";
    const list = ytList(kind);

    const move = (from, to) => {
      if (from === to || to < 0 || to >= list.length) return;
      const next = list.slice();
      const [item] = next.splice(from, 1);
      next.splice(to, 0, item);
      ytSetList(kind, next);
    };

    const rows = list.map((v, i) => {
      const id = ytIdFromUrl(v.youtube) || "";
      const isFeatured = !short && id && ytIdFromUrl(content.settings.featuredEpisode) === id;
      const isPlayer = !short && id && ytIdFromUrl(content.settings.offlineVideo) === id;
      const pick = (key, on) => {
        const serieAntes = serieDe(content.settings.featuredEpisode);
        content.settings[key] = on ? "" : v.youtube;
        // La fecha de término y el «próximo capítulo» son de ese destacado: si el
        // ★ pasa a otra serie (o a un capítulo suelto), no se arrastran.
        if (key === "featuredEpisode" && (on || !serieAntes || serieAntes !== serieDe(v.youtube))) {
          delete content.settings.featuredUntil;
          delete content.settings.featuredSeriesNext;
        }
        // Un ★ nuevo es la «Entrevista de la semana»: dura 7 días y, si el
        // capítulo no tiene frase ni invitado, se sacan del título.
        if (key === "featuredEpisode" && !on) {
          if (!content.settings.featuredUntil) content.settings.featuredUntil = enDias(DIAS_SEMANA);
          fichaDesdeTitulo(v);
        }
        markDirty();
        renderBody();
      };

      return el("div", { class: "yt-row", draggable: "true", "data-i": String(i) },
        el("span", { class: "yt-grip", title: "Arrastra para reordenar" }, "⠿"),
        el("span", { class: "yt-pos" }, String(i + 1)),
        el("img", { class: "yt-thumb" + (short ? " vertical" : ""), alt: "", loading: "lazy",
          // En un reel, oar2 es un cuadro del video; hqdefault sería la
          // miniatura diseñada que se subió a YouTube.
          src: `https://i.ytimg.com/vi/${id}/${short ? "oar2" : "hqdefault"}.jpg`,
          onError: (e) => { const fb = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; if (e.currentTarget.src !== fb) e.currentTarget.src = fb; } }),
        el("div", { class: "yt-info" },
          el("input", { class: "yt-title-input", type: "text", value: v.title || "", placeholder: id,
            title: v.title || id,
            oninput: (e) => { v.title = e.target.value; markDirty(); } }),
          // En un reel, «Destacado» decide si sale en la fila de la portada:
          // con al menos uno marcado, la portada muestra sólo los marcados.
          short ? el("div", { class: "yt-extra" },
            el("label", { class: "yt-peso", title: "Sale en la fila de reels de la portada. Si no marcas ninguno, salen los 12 más nuevos." },
              el("input", { type: "checkbox", checked: v.peso ? "" : null,
                onchange: (e) => { if (e.target.checked) v.peso = true; else delete v.peso; markDirty(); renderBody(); } }),
              "Destacado",
            ),
          ) : el("div", { class: "yt-extra" },
            el("input", { class: "yt-serie", type: "text", list: "yt-series", value: v.serie || "",
              placeholder: "Serie (opcional)", "aria-label": "Serie",
              title: "Los capítulos con la misma serie se muestran juntos en la portada",
              oninput: (e) => { const s = e.target.value.trim(); if (s) v.serie = s; else delete v.serie; markDirty(); },
              // El recuadro del ★ muestra la serie del destacado: sólo esa fila
              // redibuja al salir del campo (redibujar siempre le quitaría el
              // foco al campo de la fila siguiente).
              onchange: () => { if (isFeatured) renderBody(); } }),
            el("select", { class: "yt-tema", "aria-label": "Tema", title: "Se muestra bajo el título en la portada",
              onchange: (e) => { if (e.target.value) v.tema = e.target.value; else delete v.tema; markDirty(); } },
              el("option", { value: "" }, "Sin tema"),
              TEMAS.map((t) => el("option", { value: t, selected: v.tema === t ? "" : null }, t)),
            ),
            el("label", { class: "yt-peso", title: "Entra a la fila de entrevistas destacadas de la portada. Si no hay ★ vigente, la más nueva es la entrevista de la semana." },
              el("input", { type: "checkbox", checked: v.peso ? "" : null,
                onchange: (e) => {
                  // Al marcarla, la frase, el invitado y el cargo salen del
                  // título y aparecen abajo para revisarlos.
                  if (e.target.checked) { v.peso = true; fichaDesdeTitulo(v); } else delete v.peso;
                  markDirty();
                  renderBody();
                } }),
              "Destacada",
            ),
          ),
          // La ficha de una destacada: lo que se ve en la fila y en grande.
          short || !v.peso ? null : el("div", { class: "yt-ficha" },
            ...[["frase", "Frase en grande"], ["invitado", "Invitado"], ["cargo", "Cargo"]].map(([campo, etiqueta]) =>
              el("input", { type: "text", value: v[campo] || "", placeholder: etiqueta, "aria-label": etiqueta, title: etiqueta,
                oninput: (e) => { const t = e.target.value.trim(); if (t) v[campo] = t; else delete v[campo]; markDirty(); } })),
          ),
        ),
        el("div", { class: "yt-actions" },
          short ? null : el("button", { class: "icon-btn" + (isFeatured ? " on" : ""),
            title: isFeatured ? "Es la entrevista de la semana — clic para quitarla" : "Poner como entrevista de la semana (dura 7 días)",
            onClick: () => pick("featuredEpisode", isFeatured) }, isFeatured ? "★" : "☆"),
          short ? null : el("button", { class: "icon-btn" + (isPlayer ? " on" : ""),
            title: isPlayer ? "Es el video del reproductor del header — clic para quitarlo" : "Poner en el reproductor del header (cuando no hay vivo)",
            onClick: () => pick("offlineVideo", isPlayer) }, "▶"),
          el("button", { class: "icon-btn", title: "Poner primero", disabled: i === 0 ? "" : null, onClick: () => move(i, 0) }, "⤒"),
          el("button", { class: "icon-btn", title: "Subir", disabled: i === 0 ? "" : null, onClick: () => move(i, i - 1) }, "↑"),
          el("button", { class: "icon-btn", title: "Bajar", disabled: i === list.length - 1 ? "" : null, onClick: () => move(i, i + 1) }, "↓"),
          el("button", { class: "icon-btn danger", title: "Quitar de la portada", onClick: () => {
            if (!confirm(`¿Quitar «${v.title || id}» de la portada?`)) return;
            if (isFeatured) {
              content.settings.featuredEpisode = "";
              delete content.settings.featuredUntil;
              delete content.settings.featuredSeriesNext;
            }
            if (isPlayer) content.settings.offlineVideo = "";
            ytSetList(kind, list.filter((x) => x !== v));
          } }, "×"),
        ),
      );
    });

    const listEl = list.length
      ? el("div", { class: "yt-list" }, rows)
      : el("p", { class: "yt-empty" }, short ? "Sin reels todavía. Pega el link de uno arriba." : "Sin capítulos todavía. Pega el link de uno arriba.");

    // Drag & drop nativo, delegado en el contenedor: la fila se suelta antes o
    // después de aquella sobre la que se está, según de qué lado del centro
    // quedó el cursor. En táctil no hay dragstart; para eso están ↑ y ↓.
    if (list.length) {
      let from = null;
      const clear = () => listEl.querySelectorAll(".yt-row").forEach((r) => r.classList.remove("drop-before", "drop-after"));
      const target = (e) => {
        const row = e.target.closest?.(".yt-row");
        if (!row) return null;
        const box = row.getBoundingClientRect();
        return { row, index: Number(row.dataset.i), before: e.clientY < box.top + box.height / 2 };
      };

      listEl.addEventListener("dragstart", (e) => {
        // Escribir el título o tocar un botón no debe arrastrar la fila.
        if (e.target.closest("input, button, select")) { e.preventDefault(); return; }
        const row = e.target.closest(".yt-row");
        if (!row) return;
        from = Number(row.dataset.i);
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(from)); // Firefox lo exige
      });
      listEl.addEventListener("dragend", () => {
        from = null;
        clear();
        listEl.querySelectorAll(".yt-row").forEach((r) => r.classList.remove("dragging"));
      });
      listEl.addEventListener("dragover", (e) => {
        if (from === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        clear();
        const t = target(e);
        if (t && t.index !== from) t.row.classList.add(t.before ? "drop-before" : "drop-after");
      });
      listEl.addEventListener("dragleave", (e) => { if (!listEl.contains(e.relatedTarget)) clear(); });
      listEl.addEventListener("drop", (e) => {
        if (from === null) return;
        e.preventDefault();
        const t = target(e);
        if (!t) return;
        // Al sacar la fila de su posición, todo lo que venía después corre uno.
        let to = t.before ? t.index : t.index + 1;
        if (to > from) to -= 1;
        move(from, to);
      });
    }

    return el("div", null,
      el("div", { class: "yt-col-head" },
        el("span", { class: "yt-col-title" }, label),
        el("span", { class: "yt-meta" }, `${list.length} ${list.length === 1 ? "video" : "videos"}`
          + (short ? ` · ${list.filter((x) => x.peso).length || "ninguno"} ${list.filter((x) => x.peso).length === 1 ? "destacado" : "destacados"} en la portada` : "")),
      ),
      listEl,
    );
  }

  // El ★ es la «Entrevista de la semana». Acá se ve hasta cuándo dura y, si
  // es un capítulo suelto, la frase, el invitado y el cargo que se muestran en
  // grande; si es una serie, el próximo capítulo que se anuncia al final de

    return el("div", { class: "yt-destacado" },

      ),

        el("input", { type: "date", value: s.featuredUntil || "",

        el("span", { class: "yt-hint" + (vencida ? " yt-hint-alerta" : "") }, vencida
          ? "Ya venció: la portada parte en la destacada más nueva. Marca otro ★ o cambia la fecha."
          : s.featuredUntil
            ? "Se pone sola una semana después de marcar el ★. Pasado ese día, la portada parte en la destacada más nueva."
            : "Sin fecha, queda destacada hasta que la cambies."),
      ),
      serie ? null : el("div", { class: "yt-destacado-trio" },
        texto("frase", "Frase en grande", "Sin frase, se muestra el título completo.", "La cita del invitado"),
        texto("invitado", "Invitado", "Nombre y apellido.", "Nombre y apellido"),
        texto("cargo", "Cargo", "Va en una etiqueta junto al nombre.", "Ej.: Seremi de Economía"),
        el("button", { class: "btn btn-ghost yt-desde-titulo", type: "button",
          title: "Reemplaza frase, invitado y cargo por lo que dice el título",
          onClick: () => {
            const d = desdeTitulo(ep.title);
            for (const k of ["frase", "invitado", "cargo"]) { if (d[k]) ep[k] = d[k]; else delete ep[k]; }
            markDirty();
            renderBody();
            if (!d.frase && !d.invitado) toast("El título no trae frase ni invitado: complétalos a mano", "err");
          } }, "Sacar del título"),
      ),
      serie ? el("label", { class: "yt-destacado-field" }, "Próximo capítulo de la serie",
        el("input", { type: "text", value: s.featuredSeriesNext || "", placeholder: "Ej.: Viernes 25 · 12:30",
          oninput: (e) => { const t = e.target.value.trim(); if (t) s.featuredSeriesNext = t; else delete s.featuredSeriesNext; markDirty(); } }),
        el("span", { class: "yt-hint" }, "Opcional. Se anuncia al final de la fila de la serie. Bórralo cuando se publique."),
      ) : null,
    );
  }

  function renderPodcast() {
    const series = [...new Set(ytList("episode").map((v) => (v.serie || "").trim()).filter(Boolean))];
    return el("div", { class: "panel active" },

  /* ───────── En cuadritos (content.cuadritos) ───────── */
  // Los carruseles de noticias de la portada: [{ titulo, texto,
  // instagram, laminas: [url], added }], los nuevos arriba. Las láminas se
  // achican en el navegador a JPG de 600 × 750 antes de subirlas (un PNG de
  // 1080 × 1350 pesa 0,5 MB; el JPG, unos 60–80 KB) y se suben una por una.
  const LAMINA_ANCHO = 600, LAMINA_ALTO = 750, LAMINA_CALIDAD = 0.72;

  async function achicarLamina(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, LAMINA_ANCHO / bmp.width, LAMINA_ALTO / bmp.height);
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, 0, 0, w, h);
    bmp.close?.();
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", LAMINA_CALIDAD));
    if (!blob) throw new Error("no se pudo convertir la imagen");
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  }

  // La primera vez que se abre el panel con esta pestaña, la lista no existe:
  // se cargan los carruseles de octubre que vienen en el sitio.
  async function semillaCuadritos() {
    if (Array.isArray(content.cuadritos)) return 0;
    try {
      const r = await fetch("/cuadritos/semilla.json", { cache: "no-store" });
      const lista = r.ok ? await r.json() : null;
      if (!Array.isArray(lista)) return 0;
      content.cuadritos = lista;
      return lista.length;
    } catch { return 0; }
  }

  function renderCuadritos() {
    if (!Array.isArray(content.cuadritos)) content.cuadritos = [];
    const lista = content.cuadritos;

    // Formulario para un carrusel nuevo. Lo escrito sobrevive a los redibujos
    // de la pestaña mientras no se agregue.
    const nuevo = renderCuadritos.borrador || (renderCuadritos.borrador = { titulo: "", instagram: "", texto: "", archivos: [] });
    const campo = (k, etiqueta, ayuda, ph, multi) => el("label", { class: "cq-campo" + (multi ? " cq-ancho" : "") },
      el("span", { class: "field-label" }, etiqueta),
      multi
        ? el("textarea", { rows: "4", placeholder: ph, oninput: (e) => { nuevo[k] = e.target.value; } }, nuevo[k])
        : el("input", { type: k === "instagram" ? "url" : "text", value: nuevo[k], placeholder: ph, oninput: (e) => { nuevo[k] = e.target.value; } }),
      ayuda ? el("span", { class: "field-hint" }, ayuda) : null,
    );
    const resumen = el("p", { class: "cq-archivos" }, nuevo.archivos.length
      ? `${nuevo.archivos.length} láminas: ${nuevo.archivos.map((f) => f.name).join(", ")}`
      : "Ninguna lámina elegida todavía.");
    const elegir = (files) => {
      const imgs = [...files].filter((f) => /^image\/(png|jpe?g|webp)$/.test(f.type));
      if (!imgs.length) { toast("Elige las láminas en PNG o JPG", "err"); return; }
      // En el orden del nombre: 01.png, 02.png… como salen de la carpeta.
      nuevo.archivos = imgs.sort((a, b) => a.name.localeCompare(b.name, "es", { numeric: true }));
      renderBody();
    };
    const input = el("input", { type: "file", accept: "image/png,image/jpeg,image/webp", multiple: "", class: "cq-file",
      onchange: (e) => elegir(e.target.files) });
    const zona = el("div", { class: "cq-zona" },
      el("p", null, el("strong", null, "Arrastra aquí las láminas"), " del carrusel (01.png, 02.png…) o "),
      el("button", { class: "btn btn-ghost", type: "button", onClick: () => input.click() }, "Elegir archivos"),
      input,
      resumen,
    );
    zona.addEventListener("dragover", (e) => { e.preventDefault(); zona.classList.add("sobre"); });
    zona.addEventListener("dragleave", () => zona.classList.remove("sobre"));
    zona.addEventListener("drop", (e) => { e.preventDefault(); zona.classList.remove("sobre"); elegir(e.dataTransfer.files); });

    const progreso = el("p", { class: "cq-progreso", "aria-live": "polite" });
    const boton = el("button", { class: "btn", type: "button" }, "Subir y agregar arriba");
    boton.addEventListener("click", async () => {
      if (!nuevo.archivos.length) { toast("Primero elige las láminas", "err"); return; }
      if (!nuevo.titulo.trim()) { toast("Ponle un título corto al carrusel", "err"); return; }
      boton.disabled = true;
      const urls = [];
      try {
        for (let i = 0; i < nuevo.archivos.length; i++) {
          progreso.textContent = `Subiendo lámina ${i + 1} de ${nuevo.archivos.length}…`;
          const jpg = await achicarLamina(nuevo.archivos[i]);
          const base = (nuevo.titulo.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").slice(0, 40) || "cuadritos");
          urls.push(await uploadImage(new File([jpg], `cuadritos-${base}-${String(i + 1).padStart(2, "0")}.jpg`, { type: "image/jpeg" })));
        }
      } catch (err) {
        progreso.textContent = "";
        boton.disabled = false;
        toast(`No se pudo subir la lámina ${urls.length + 1}: ${err.message}`, "err");
        return;
      }
      const item = { titulo: nuevo.titulo.trim(), texto: nuevo.texto.trim(), instagram: nuevo.instagram.trim(), laminas: urls, added: hoyChile() };
      for (const k of ["texto", "instagram"]) if (!item[k]) delete item[k];
      content.cuadritos = [item, ...lista];
      renderCuadritos.borrador = null;
      markDirty();
      renderBody();
      toast("Carrusel agregado arriba. Recuerda Guardar.", "ok");
    });

    const form = el("div", { class: "cq-nuevo" },
      el("h3", { class: "cq-sub" }, "Agregar un carrusel"),
      zona,
      el("div", { class: "cq-campos" },
        campo("titulo", "Título", "Corto: va bajo la portada y en el visor.", "Ej.: Presupuesto 2027 del GORE"),
        campo("instagram", "Link del post en Instagram", "Opcional. Sin link, el botón lleva al perfil.", "https://www.instagram.com/p/…"),
        campo("texto", "Texto", "Opcional. El gancho y el primer párrafo del pie; una línea en blanco separa párrafos.", "Así se distribuye el presupuesto regional…", true),
      ),
      el("div", { class: "cq-acciones" }, boton, progreso),
    );

    const mover = (from, to) => {
      if (to < 0 || to >= lista.length) return;
      const next = lista.slice();
      const [it] = next.splice(from, 1);
      next.splice(to, 0, it);
      content.cuadritos = next;
      markDirty();
      renderBody();
    };
    const editar = (c, k) => (e) => { const t = e.target.value.trim(); if (t) c[k] = t; else delete c[k]; markDirty(); };
    const filas = lista.map((c, i) => el("div", { class: "cq-fila" },
      el("img", { class: "cq-thumb", src: c.laminas?.[0] || "", alt: "", loading: "lazy" }),
      el("div", { class: "cq-datos" },
        el("input", { type: "text", value: c.titulo || "", placeholder: "Título", "aria-label": "Título", oninput: editar(c, "titulo") }),
        el("input", { type: "url", value: c.instagram || "", placeholder: "Link del post en Instagram", "aria-label": "Link del post en Instagram", oninput: editar(c, "instagram") }),
        el("textarea", { rows: "2", placeholder: "Texto (opcional)", "aria-label": "Texto", oninput: editar(c, "texto") }, c.texto || ""),
        el("span", { class: "yt-hint" }, `${(c.laminas || []).length} láminas${c.added ? ` · agregado el ${c.added}` : ""}`),
      ),
      el("div", { class: "yt-actions" },
        el("button", { class: "icon-btn", title: "Poner primero", disabled: i === 0 ? "" : null, onClick: () => mover(i, 0) }, "⤒"),
        el("button", { class: "icon-btn", title: "Subir", disabled: i === 0 ? "" : null, onClick: () => mover(i, i - 1) }, "↑"),
        el("button", { class: "icon-btn", title: "Bajar", disabled: i === lista.length - 1 ? "" : null, onClick: () => mover(i, i + 1) }, "↓"),
        el("button", { class: "icon-btn danger", title: "Quitar de la portada", onClick: () => {
          if (!confirm(`¿Quitar «${c.titulo || "este carrusel"}» de la portada?`)) return;
          content.cuadritos = lista.filter((x) => x !== c);
          markDirty();
          renderBody();
        } }, "×"),
      ),
    ));

    return el("div", { class: "panel active" },
      el("h2", { class: "panel-title" }, "La Región al Día"),
      el("p", { class: "panel-sub" },
        "Los carruseles de noticias que se ven en la portada, en el orden de esta lista. Arrastra las láminas de la carpeta «carrusel», ponle título, y se agrega arriba de todo. Las láminas se achican solas antes de subirse. Sin ningún carrusel, la sección no aparece. Recuerda Guardar; la portada tarda hasta 1 minuto en actualizarse."),
      form,
      el("div", { class: "yt-col-head", style: "margin-top:28px" },
        el("span", { class: "yt-col-title" }, "En la portada"),
        el("span", { class: "yt-meta" }, `${lista.length} ${lista.length === 1 ? "carrusel" : "carruseles"}`),
      ),
      lista.length ? el("div", { class: "yt-list" }, filas) : el("p", { class: "yt-empty" }, "Sin carruseles. Agrega uno arriba."),
    );
  }

    return ({

  /* ───────── Item helpers ───────── */
  function cardHeader(title, idx, list) {

  function textField(label, value, onChange, type = "text", hint = "") {
    return el("div", { class: "field" },
      el("label", { class: "field-label" }, label),
      el("input", { type, value: value ?? "", oninput: (e) => onChange(e.target.value) }),
      hint ? el("p", { class: "field-hint" }, hint) : null,
    );
  }
  function textAreaField(label, value, onChange, hint = "") {
    return el("div", { class: "field" },
      el("label", { class: "field-label" }, label),
      el("textarea", { oninput: (e) => onChange(e.target.value) }, value ?? ""),
      hint ? el("p", { class: "field-hint" }, hint) : null,
    );
  }

  function imageField(label, value, onChange) {
    const thumb = el("div", { class: "img-thumb" }, value ? "" : "Sin imagen");
    if (value) thumb.style.backgroundImage = `url(${JSON.stringify(value)})`;
    const urlInput = el("input", { type: "text", placeholder: "URL de imagen", value: value ?? "",
      oninput: (e) => { onChange(e.target.value); thumb.style.backgroundImage = e.target.value ? `url(${JSON.stringify(e.target.value)})` : ""; thumb.textContent = e.target.value ? "" : "Sin imagen"; } });
    const fileInput = el("input", { type: "file", accept: "image/*", onChange: async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        toast("Subiendo imagen…", "ok");
        const url = await uploadImage(file);
        urlInput.value = url;
        onChange(url);
        thumb.style.backgroundImage = `url(${JSON.stringify(url)})`;
        thumb.textContent = "";
        toast("Imagen subida", "ok");
      } catch (err) { toast(`Error: ${err.message}`, "err"); }
    } });
    return el("div", { class: "field" },
      el("label", { class: "field-label" }, label),
      el("div", { class: "img-field" },
        thumb,
        el("div", { class: "img-actions" }, urlInput, fileInput),
      ),
    );
  }

  /* ─── Card renderers (one per list type) ─── */
  function newsCard(item, idx, list) {
    return el("div", { class: "item-card" },
      cardHeader(`Noticia ${idx + 1}`, idx, list),
      el("div", { class: "field-row" },
        el("div", { class: "field" },
          el("label", { class: "field-label" }, "Categoría"),
          (() => {
            const sel = el("select", { onchange: (e) => { item.cat = e.target.value; markDirty(); } });
            ["DEPORTE","POLÍTICA","REGIÓN","CULTURA","ECONOMÍA","SUCESOS"].forEach(c => {
              const o = el("option", { value: c }, c);
              if (item.cat === c) o.setAttribute("selected", "");
              sel.appendChild(o);
            });
            return sel;
          })(),
        ),
        textField("Fecha", item.time, (v) => { item.time = v; markDirty(); }),
      ),
      textField("Titular", item.headline, (v) => { item.headline = v; markDirty(); }),
      textAreaField("Bajada", item.bajada, (v) => { item.bajada = v; markDirty(); }),
    );
  }
  newsCard.empty = () => ({ cat: "REGIÓN", headline: "", bajada: "", time: "" });

  function programCard(item, idx, list) {
    return el("div", { class: "item-card" },
      cardHeader(`Bloque ${idx + 1}`, idx, list),
      el("div", { class: "field-row" },
        textField("Hora inicio (HH:MM)", item.start, (v) => { item.start = v; markDirty(); }),
        textField("Hora fin (HH:MM)", item.end, (v) => { item.end = v; markDirty(); }),
      ),
      textField("Nombre del programa", item.name, (v) => { item.name = v; markDirty(); }),
      textField("Conductor / Locutor", item.host, (v) => { item.host = v; markDirty(); }),
      diasField(item),
    );
  }
  // Días al aire del bloque. Sin la casilla guardada, se leen del texto del
  // conductor («· Lun, Mié, Vie») y, si no dice nada, es de lunes a viernes:
  // lo mismo que hace la portada.
  const DIAS_AL_AIRE = [[1, "Lun"], [2, "Mar"], [3, "Mié"], [4, "Jue"], [5, "Vie"], [6, "Sáb"], [0, "Dom"]];
  function diasDelBloque(item) {
    if (Array.isArray(item.days) && item.days.length) return item.days;
    const abrev = { dom: 0, lun: 1, mar: 2, mie: 3, jue: 4, vie: 5, sab: 6 };
    const cola = String(item.host || "").split("·").slice(1).join(" ").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const dias = [...new Set((cola.match(/\b(dom|lun|mar|mie|jue|vie|sab)/g) || []).map((d) => abrev[d]))];
    return dias.length ? dias : [1, 2, 3, 4, 5];
  }
  function diasField(item) {
    const marcados = new Set(diasDelBloque(item));
    return el("div", { class: "field" },
      el("label", { class: "field-label" }, "Días al aire"),
      el("div", { style: "display:flex;flex-wrap:wrap;gap:6px 16px" },
        ...DIAS_AL_AIRE.map(([n, nombre]) =>
          el("label", { style: "display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--bone)" },
            el("input", { type: "checkbox", checked: marcados.has(n) ? "" : null,
              onchange: (e) => {
                if (e.target.checked) marcados.add(n); else marcados.delete(n);
                item.days = DIAS_AL_AIRE.map(([d]) => d).filter((d) => marcados.has(d));
                markDirty();
              } }),
            nombre,
          )),
      ),
    );
  }
  programCard.empty = () => ({ start: "00:00", end: "01:00", name: "", host: "", color: "#29623a" });

  function regionCard(item, idx, list) {
    return el("div", { class: "item-card" },
      cardHeader(`Destino ${idx + 1}`, idx, list),
      textField("Nombre", item.name, (v) => { item.name = v; markDirty(); }),
      textField("Bajada / subtítulo", item.sub, (v) => { item.sub = v; markDirty(); }),
      imageField("Imagen", item.img, (v) => { item.img = v; markDirty(); }),
      el("div", { class: "field" },
        el("label", { class: "field-label" }, "Cuerpo (un párrafo por línea)"),
        (() => {
          const list = el("div", { class: "body-list" });
          (item.body || []).forEach((p, pi) => {
            const row = el("div", { class: "body-row" });
            const ta = el("textarea", { rows: 3, oninput: (e) => { item.body[pi] = e.target.value; markDirty(); } }, p);
            const del = el("button", { class: "icon-btn danger", title: "Eliminar párrafo",
              onClick: () => { item.body.splice(pi, 1); markDirty(); renderBody(); } }, "×");
            row.appendChild(ta); row.appendChild(del);
            list.appendChild(row);
          });
          const add = el("button", { class: "add-btn", style: "margin-top:8px", onClick: () => {
            item.body = [...(item.body || []), ""]; markDirty(); renderBody();
          } }, "+ Agregar párrafo");
          return el("div", null, list, add);
        })(),
      ),
    );
  }
  regionCard.empty = () => ({ name: "", sub: "", img: "", body: [""] });

  // WhatsApp: desde que la portada tiene el asistente de preguntas, lo único
  // que abre WhatsApp es la publicidad. Acá se edita ese mensaje; el número
  // está en Configuración. Las otras opciones del panel antiguo (extracto,
  // entrevista, prensa, consulta general) ya no se usan: el asistente las
  // responde o las deriva al formulario de contacto.
  function renderWhatsApp() {
    const lista = Array.isArray(content.whatsappOptions) ? content.whatsappOptions : (content.whatsappOptions = []);
    let item = lista.find((o) => /publicidad/i.test(o?.label || ""));
    return el("div", { class: "panel active" },
      el("h2", { class: "panel-title" }, "Mensaje de WhatsApp para publicidad"),
      el("p", { class: "panel-sub" }, "El asistente de la portada sólo deriva a WhatsApp cuando preguntan por publicidad. Este es el mensaje que llega escrito."),
      el("div", { class: "item-card" },
        textAreaField("Mensaje pre-armado (lo que se envía al WhatsApp)", item ? item.msg : "", (v) => {
          if (!item) { item = { label: "Cotizar publicidad", icon: "📣", msg: "" }; lista.push(item); }
          item.msg = v; markDirty();
        }, "Si lo dejas vacío, se usa el mensaje de siempre."),
      ),
    );
  }

  /* ───────── Boot ───────── */
  async function showPanel() {
    try {
      content = await loadContent();
    } catch (err) {
      toast("Error cargando contenido: " + err.message, "err");
      return;
    }
    $("#pwOverlay").style.display = "none";
    $("#adminPanel").classList.add("visible");
    $("#status").textContent = "Sin cambios";
    $("#status").className = "adm-status ok";
    renderTabs();
    renderBody();
    // Al cargar y no al abrir la pestaña: así la lista nueva se persiste con
    // cualquier Guardar, aunque el cambio haya sido en otra sección.
    if (migrateVideos()) {
      markDirty();
      renderBody();
      setTimeout(() => toast("Importé tus capítulos y reels a la lista nueva. Revísala en «Podcast y reels» y guarda.", "ok"), 600);
    }
    // Las destacadas marcadas antes de que existiera la ficha quedaron sin
    // frase, invitado ni cargo: se completan una vez desde el título y quedan
    // a la vista en su fila para revisarlas antes de guardar.
    const completadas = completarFichas();
    if (completadas) {
      markDirty();
      renderBody();
      setTimeout(() => toast(`Completé frase, invitado y cargo de ${completadas} ${completadas === 1 ? "entrevista destacada" : "entrevistas destacadas"} desde el título. Revísalos en «Podcast y reels» y guarda.`, "ok"), 900);
    }
    const sembrados = await semillaCuadritos();
    if (sembrados) {
      markDirty();
      renderBody();
      setTimeout(() => toast(`Cargué ${sembrados} carruseles de octubre en «La Región al Día». Revísalos y guarda.`, "ok"), completadas ? 3600 : 900);
    }
  }

  async function attemptLogin() {
    const val = $("#pwInput").value.trim();
    $("#pwError").textContent = "";
    if (!val) { $("#pwError").textContent = "Ingresá la contraseña"; return; }
    $("#pwBtn").disabled = true;
    try {
      const ok = await tryLogin(val);
      if (!ok) {
        $("#pwError").textContent = "Contraseña incorrecta";
        $("#pwBtn").disabled = false;
        return;
      }
      pw = val;
      sessionStorage.setItem(PW_KEY, pw);
      await showPanel();
    } catch (err) {
      $("#pwError").textContent = "Error: " + err.message;
    } finally {
      $("#pwBtn").disabled = false;
    }
  }

  $("#pwBtn").addEventListener("click", attemptLogin);
  $("#pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
  $("#saveBtn").addEventListener("click", saveContent);
  $("#logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem(PW_KEY);
    location.reload();
  });

  // beforeunload guard
  window.addEventListener("beforeunload", (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  // Auto-login if pw in sessionStorage
  if (pw) {
    tryLogin(pw).then((ok) => {
      if (ok) showPanel();
      else sessionStorage.removeItem(PW_KEY);
    }).catch(() => sessionStorage.removeItem(PW_KEY));
  }

  // Focus input on load
  setTimeout(() => $("#pwInput").focus(), 200);
</script>
</body>
</html>
