<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel de Socios — Radio Araucana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .fade-up {
        opacity: 0;
        transform: translateY(28px);
        filter: blur(3px);
        transition:
          opacity 750ms cubic-bezier(0.32, 0.72, 0, 1),
          transform 750ms cubic-bezier(0.32, 0.72, 0, 1),
          filter 750ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      .fade-up.visible {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/socios-main.jsx"></script>
  </body>
